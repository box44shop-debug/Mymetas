name: Dependency audit

on:
  push:
    branches: [chore/dependency-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Inspect affected dependency versions
        run: |
          npm ls glob minimatch workbox-build --all || true
          node -e "const l=require('./package-lock.json'); for (const [p,v] of Object.entries(l.packages||{})) if (/(^|\\/)node_modules\\/(glob|minimatch|workbox-build)$/.test(p)) console.log(p, v.version)"
      - name: Run npm audit
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const r=require('./npm-audit-report.json'); const v=r.metadata?.vulnerabilities ?? {}; console.log(JSON.stringify(v,null,2)); console.log('Direct/total advisories are detailed in the uploaded report.');"
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: mymetas-npm-audit
          path: npm-audit-report.json
          if-no-files-found: error
          retention-days: 14
