name: Dependency audit

on:
  push:
    branches: [chore/dependency-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Inspect current dependency versions
        run: |
          node -e "const l=require('./package-lock.json'); for (const [p,v] of Object.entries(l.packages||{})) if (/(^|\\/)node_modules\\/(glob|minimatch|workbox-build)$/.test(p)) console.log(p, v.version)"
      - name: Preview non-breaking security fixes (dry run)
        run: |
          npm audit fix --dry-run > npm-audit-fix-plan.txt 2>&1 || true
          cat npm-audit-fix-plan.txt
      - name: Apply compatible security fixes
        run: npm audit fix
      - name: Install exact locked dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Verify dependency audit
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const r=require('./npm-audit-report.json'); const v=r.metadata?.vulnerabilities ?? {}; console.log(JSON.stringify(v,null,2)); if ((v.total ?? 0) > 0) process.exit(1)"
      - name: Commit reviewed lockfile to audit branch
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update dependency lockfile with security fixes"
            git push origin HEAD:chore/dependency-audit
          else
            echo "No lockfile changes to commit."
          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mymetas-npm-audit
          path: |
            npm-audit-report.json
            npm-audit-fix-plan.txt
          if-no-files-found: ignore
          retention-days: 14
