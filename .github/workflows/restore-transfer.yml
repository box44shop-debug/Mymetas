name: Restore compact source transfer

on:
  push:
    paths:
      - ".github/workflows/restore-transfer.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original project files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');
          const files = [
            ['transfer-payload/App.tsx.gz.b64', 'src/App.tsx'],
            ['transfer-payload/styles.css.gz.b64', 'src/styles.css'],
            ['transfer-payload/icon-192.png.gz.b64', 'public/icon-192.png'],
            ['transfer-payload/icon-512.png.gz.b64', 'public/icon-512.png'],
          ];
          for (const [source, destination] of files) {
            const encoded = fs.readFileSync(source, 'utf8').trim();
            const decoded = zlib.gunzipSync(Buffer.from(encoded, 'base64'));
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.writeFileSync(destination, decoded);
            console.log(`Restored ${destination}: ${decoded.length} bytes`);
          }
          fs.rmSync('transfer-payload', { recursive: true, force: true });
          NODE
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css public/icon-192.png public/icon-512.png transfer-payload
          git commit -m "Restore complete Metas application source"
          git push
